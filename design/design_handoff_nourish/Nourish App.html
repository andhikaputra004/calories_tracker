function AnimatedRing({ size = 240, strokeWidth = 16, progress = 0.7, color = T.green, bgColor = '#E8E3D8', delay = 0, children }) {
  const r = (size - strokeWidth) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - progress);
  const [animated, setAnimated] = useState(false);
  const [displayOffset, setDisplayOffset] = useState(circ);

  useEffect(() => {
    const t = setTimeout(() => {
      setAnimated(true);
      setDisplayOffset(offset);
    }, delay);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (animated) setDisplayOffset(offset);
  }, [progress, animated]);

  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bgColor} strokeWidth={strokeWidth} />
        <circle
          cx={size/2} cy={size/2} r={r}
          fill="none"
          stroke={color}
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeDasharray={circ}
          strokeDashoffset={displayOffset}
          style={{ transition: animated ? 'stroke-dashoffset 1.2s cubic-bezier(0.34,1.56,0.64,1)' : 'none' }}
        />
      </svg>
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
      }}>{children}</div>
    </div>
  );
}

function MacroBar({ label, current, goal, color, delay = 0 }) {
  const pct = Math.min(current / goal, 1);
  const [w, setW] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setW(pct * 100), delay);
    return () => clearTimeout(t);
  }, []);
  useEffect(() => { setW(pct * 100); }, [pct]);

  return (
    <div style={{ flex: 1 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
        <span style={{ fontSize: 11, fontWeight: 600, color: T.textSec, letterSpacing: 0.3, textTransform: 'uppercase' }}>{label}</span>
        <span style={{ fontSize: 11, color: T.textMuted }}>{current}g</span>
      </div>
      <div style={{ height: 6, background: T.surface, borderRadius: 99, overflow: 'hidden' }}>
        <div style={{
          height: '100%', background: color, borderRadius: 99,
          width: `${w}%`,
          transition: 'width 1s cubic-bezier(0.34,1.56,0.64,1)',
        }} />
      </div>
      <div style={{ fontSize: 10, color: T.textMuted, marginTop: 3 }}>Goal {goal}g</div>
    </div>
  );
}

// Stats Screen
function StatsScreen({ logs, tweaks }) {
  const weekData = [
    { day: 'Sen', cal: 1820, goal: 2000 },
    { day: 'Sel', cal: 2100, goal: 2000 },
    { day: 'Rab', cal: 1650, goal: 2000 },
    { day: 'Kam', cal: 1940, goal: 2000 },
    { day: 'Jum', cal: 2200, goal: 2000 },
    { day: 'Sab', cal: 1750, goal: 2000 },
    { day: 'Min', cal: 1420, goal: 2000 },
  ];
  const maxCal = 2400;
  const [animate, setAnimate] = useState(false);
  useEffect(() => { setTimeout(() => setAnimate(true), 200); }, []);

  const totalCal = Object.values(logs).flat().reduce((s, f) => s + f.totalCal, 0);
  const totalP = Math.round(Object.values(logs).flat().reduce((s, f) => s + f.p * f.qty, 0));
  const totalC = Math.round(Object.values(logs).flat().reduce((s, f) => s + f.c * f.qty, 0));
  const totalF = Math.round(Object.values(logs).flat().reduce((s, f) => s + f.f * f.qty, 0));
  const macroTotal = totalP + totalC + totalF;

  return (
    <div style={{ height: '100%', background: T.bg, overflowY: 'auto', paddingBottom: 90 }}>
      <IOSStatusBar dark={false} time="9:41" />
      <div style={{ padding: '12px 24px 0', marginBottom: 20 }}>
        <div style={{ fontSize: 13, color: T.textSec }}>Rabu, 7 Mei 2026</div>
        <div style={{ fontSize: 24, fontWeight: 700, color: T.text }}>Statistik</div>
      </div>

      {/* Weekly bar chart */}
      <div style={{ margin: '0 16px 16px', background: T.bgCard, borderRadius: 24, padding: '20px' }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: T.text, marginBottom: 4 }}>Kalori Mingguan</div>
        <div style={{ fontSize: 13, color: T.textSec, marginBottom: 20 }}>7 hari terakhir</div>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 8, height: 120 }}>
          {weekData.map((d, i) => {
            const h = (d.cal / maxCal) * 100;
            const isToday = i === 6;
            return (
              <div key={d.day} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
                <div style={{ fontSize: 10, color: d.cal > d.goal ? T.red : T.textMuted, fontWeight: d.cal > d.goal ? 700 : 400 }}>
                  {d.cal > d.goal ? '↑' : ''}
                </div>
                <div style={{ width: '100%', display: 'flex', justifyContent: 'center' }}>
                  <div style={{
                    width: '70%', borderRadius: '4px 4px 2px 2px',
                    background: isToday ? tweaks.accentColor : d.cal > d.goal ? T.red : T.surface,
                    height: animate ? `${h}%` : 0,
                    minHeight: animate ? 4 : 0,
                    transition: `height 0.8s cubic-bezier(0.34,1.56,0.64,1) ${i * 0.06}s`,
                    opacity: isToday ? 1 : 0.6,
                  }} />
                </div>
                <div style={{ fontSize: 11, color: isToday ? tweaks.accentColor : T.textSec, fontWeight: isToday ? 700 : 400 }}>{d.day}</div>
              </div>
            );
          })}
        </div>
        {/* Goal line label */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 12 }}>
          <div style={{ width: 20, height: 1.5, background: T.textMuted, borderStyle: 'dashed' }} />
          <span style={{ fontSize: 11, color: T.textMuted }}>Target {tweaks.goalCalories.toLocaleString()} kkal</span>
        </div>
      </div>

      {/* Macro donut */}
      <div style={{ margin: '0 16px 16px', background: T.bgCard, borderRadius: 24, padding: '20px' }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: T.text, marginBottom: 16 }}>Distribusi Makro Hari Ini</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
          <div style={{ position: 'relative', flexShrink: 0 }}>
            <svg width={120} height={120} style={{ transform: 'rotate(-90deg)' }}>
              {(() => {
                const r = 46, circ = 2 * Math.PI * r;
                const segments = [
                  { v: totalP / macroTotal, c: T.green },
                  { v: totalC / macroTotal, c: T.yellow },
                  { v: totalF / macroTotal, c: T.red },
                ];
                let offset = 0;
                return segments.map((s, i) => {
                  const len = s.v * circ;
                  const el = (
                    <circle key={i} cx={60} cy={60} r={r}
                      fill="none" stroke={s.c} strokeWidth={16}
                      strokeDasharray={`${animate ? len : 0} ${circ}`}
                      strokeDashoffset={-offset}
                      style={{ transition: `stroke-dasharray 1s ease ${0.3 + i * 0.15}s` }}
                    />
                  );
                  offset += len;
                  return el;
                });
              })()}
              <circle cx={60} cy={60} r={36} fill="white" />
            </svg>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column' }}>
              <div style={{ fontFamily: 'DM Serif Display, serif', fontSize: 20, color: T.text }}>{totalCal}</div>
              <div style={{ fontSize: 10, color: T.textSec }}>kkal</div>
            </div>
          </div>
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
            {[['Protein', totalP, macroTotal, T.green], ['Karbo', totalC, macroTotal, T.yellow], ['Lemak', totalF, macroTotal, T.red]].map(([label, val, total, color]) => (
              <div key={label}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <div style={{ width: 10, height: 10, borderRadius: 3, background: color }} />
                    <span style={{ fontSize: 13, color: T.textSec }}>{label}</span>
                  </div>
                  <span style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{val}g</span>
                </div>
                <div style={{ height: 6, background: T.surface, borderRadius: 99, overflow: 'hidden' }}>
                  <div style={{ height: '100%', background: color, borderRadius: 99, width: animate ? `${(val / macroTotal) * 100}%` : 0, transition: 'width 1s ease 0.5s' }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Streaks */}
      <div style={{ margin: '0 16px', background: T.bgCard, borderRadius: 24, padding: '20px' }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: T.text, marginBottom: 16 }}>Pencapaian</div>
        <div style={{ display: 'flex', gap: 12 }}>
          {[
            { icon: '🔥', value: '7', label: 'Hari berturut-turut', color: '#FF6B35' },
            { icon: '🎯', value: '85%', label: 'Akurasi target', color: tweaks.accentColor },
            { icon: '🥗', value: '42', label: 'Makanan berbeda', color: T.yellow },
          ].map(s => (
            <div key={s.label} style={{ flex: 1, background: T.bg, borderRadius: 16, padding: '14px 10px', textAlign: 'center' }}>
              <div style={{ fontSize: 24, marginBottom: 4 }}>{s.icon}</div>
              <div style={{ fontFamily: 'DM Serif Display, serif', fontSize: 22, color: s.color }}>{s.value}</div>
              <div style={{ fontSize: 10, color: T.textSec, lineHeight: 1.3 }}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Profile Screen
function ProfileScreen({ tweaks }) {
  const stats = [
    { label: 'Berat Saat Ini', value: '65 kg' },
    { label: 'Target', value: '60 kg' },
    { label: 'BMI', value: '22.3' },
    { label: 'TDEE', value: '2,180 kkal' },
  ];
  const prefs = [
    { label: 'Target Kalori Harian', value: `${tweaks.goalCalories.toLocaleString()} kkal` },
    { label: 'Level Aktivitas', value: 'Sedang' },
    { label: 'Alergi Makanan', value: 'Tidak ada' },
    { label: 'Tujuan', value: 'Turun Berat Badan' },
  ];

  return (
    <div style={{ height: '100%', background: T.bg, overflowY: 'auto', paddingBottom: 90 }}>
      <IOSStatusBar dark={false} time="9:41" />
      {/* Header */}
      <div style={{ background: T.bgCard, padding: '16px 24px 24px', marginBottom: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <div style={{ width: 64, height: 64, borderRadius: 32, background: `linear-gradient(135deg, ${tweaks.accentColor}, ${T.greenDark})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <span style={{ fontSize: 28, fontFamily: 'DM Serif Display, serif', color: '#fff' }}>{tweaks.userName[0] || 'R'}</span>
          </div>
          <div>
            <div style={{ fontSize: 22, fontWeight: 700, color: T.text, fontFamily: 'DM Sans, sans-serif' }}>{tweaks.userName}</div>
            <div style={{ fontSize: 14, color: T.textSec }}>Bergabung sejak Januari 2026</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 4 }}>
              <div style={{ width: 8, height: 8, borderRadius: 4, background: tweaks.accentColor }} />
              <span style={{ fontSize: 12, color: tweaks.accentColor, fontWeight: 600 }}>7 hari streak</span>
            </div>
          </div>
        </div>
      </div>

      {/* Body Stats */}
      <div style={{ margin: '0 16px 12px', background: T.bgCard, borderRadius: 20, padding: '16px', display: 'flex', gap: 0 }}>
        {stats.map((s, i) => (
          <div key={s.label} style={{ flex: 1, textAlign: 'center', borderRight: i < stats.length - 1 ? `1px solid ${T.border}` : 'none' }}>
            <div style={{ fontFamily: 'DM Serif Display, serif', fontSize: 20, color: T.text }}>{s.value}</div>
            <div style={{ fontSize: 11, color: T.textSec, marginTop: 2 }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Settings */}
      <div style={{ margin: '0 16px 12px' }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: T.textSec, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 8, padding: '0 4px' }}>Preferensi</div>
        <div style={{ background: T.bgCard, borderRadius: 20, overflow: 'hidden' }}>
          {prefs.map((p, i) => (
            <div key={p.label} style={{ padding: '14px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: i < prefs.length - 1 ? `1px solid ${T.border}` : 'none' }}>
              <span style={{ fontSize: 15, color: T.text }}>{p.label}</span>
              <span style={{ fontSize: 14, color: T.textSec, fontWeight: 500 }}>{p.value}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Logout */}
      <div style={{ margin: '0 16px' }}>
        <button style={{ width: '100%', background: T.redLight, color: T.red, border: 'none', borderRadius: 16, padding: '14px', fontSize: 15, fontWeight: 600, cursor: 'pointer', fontFamily: 'DM Sans, sans-serif' }}>
          Keluar dari Akun
        </button>
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('onboarding');
  const [tab, setTab] = useState('home');
  const [logs, setLogs] = useState(INITIAL_LOGS);
  const [addingMeal, setAddingMeal] = useState(null);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  const handleTab = (t) => {
    if (t === 'add') { setAddingMeal('Makan Malam'); setScreen('addFood'); return; }
    setTab(t); setScreen('main');
  };

  const handleAddFood = (mealType) => { setAddingMeal(mealType); setScreen('addFood'); };

  const handleFoodAdded = (food) => {
    setLogs(prev => ({
      ...prev,
      [addingMeal]: [...(prev[addingMeal] || []), food],
    }));
  };

  // Tweaks setup
  useEffect(() => {
    const listener = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakVisible(false);
    };
    window.addEventListener('message', listener);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', listener);
  }, []);

  const [tweakVisible, setTweakVisible] = useState(false);

  const renderContent = () => {
    if (screen === 'onboarding') return <OnboardingScreen onDone={() => { setScreen('main'); setTab('home'); }} tweaks={tweaks} />;
    if (screen === 'addFood') return <AddFoodScreen mealType={addingMeal} onAdd={handleFoodAdded} onBack={() => setScreen('main')} tweaks={tweaks} />;
    if (screen === 'main') {
      return (
        <div style={{ height: '100%', position: 'relative' }}>
          {tab === 'home' && <HomeScreen logs={logs} onTab={handleTab} tweaks={tweaks} />}
          {tab === 'log' && <LogScreen logs={logs} onAddFood={handleAddFood} tweaks={tweaks} />}
          {tab === 'stats' && <StatsScreen logs={logs} tweaks={tweaks} />}
          {tab === 'profile' && <ProfileScreen tweaks={tweaks} />}
          <TabBar active={tab} onTab={handleTab} />
        </div>
      );
    }
  };

  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%' }}>
      <IOSDevice width={390} height={844} dark={false}>
        <div style={{ height: '100%', position: 'relative' }}>
          {renderContent()}
        </div>
      </IOSDevice>

      {tweakVisible && (
        <TweaksPanel onClose={() => {
          setTweakVisible(false);
          window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
        }}>
          <TweakSection title="Profil">
            <TweakText label="Nama Pengguna" value={tweaks.userName} onChange={v => {
              const next = { ...tweaks, userName: v };
              setTweaks(next);
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { userName: v } }, '*');
            }} />
            <TweakNumber label="Target Kalori (kkal)" value={tweaks.goalCalories} min={1200} max={4000} step={50} onChange={v => {
              const next = { ...tweaks, goalCalories: v };
              setTweaks(next);
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { goalCalories: v } }, '*');
            }} />
          </TweakSection>
          <TweakSection title="Tampilan">
            <TweakColor label="Warna Aksen" value={tweaks.accentColor} options={['#4A7C59', '#2B6CB0', '#C45C4A', '#8B5CF6', '#D4A843']} onChange={v => {
              const next = { ...tweaks, accentColor: v };
              setTweaks(next);
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: v } }, '*');
            }} />
          </TweakSection>
          <TweakSection title="Navigasi">
            <TweakButton label="→ Onboarding" onClick={() => setScreen('onboarding')} />
            <TweakButton label="→ Dashboard" onClick={() => { setScreen('main'); setTab('home'); }} />
            <TweakButton label="→ Food Log" onClick={() => { setScreen('main'); setTab('log'); }} />
            <TweakButton label="→ Statistik" onClick={() => { setScreen('main'); setTab('stats'); }} />
            <TweakButton label="→ Profil" onClick={() => { setScreen('main'); setTab('profile'); }} />
            <TweakButton label="→ Tambah Makanan" onClick={() => { setAddingMeal('Sarapan'); setScreen('addFood'); }} />
          </TweakSection>
        </TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
